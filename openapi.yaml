openapi: 3.0.0
info:
  title: Windtre Mock Backend API
  version: 1.0.0
  description: Mock WINDTRE telecom API for Sprinklr training and demo environments.
servers:
  - url: https://sprinklr-personalized-cx.vercel.app/api/v1
paths:
  /auth/token:
    post:
      summary: Get an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenData'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /customers/register:
    post:
      summary: Register a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegistrationRequest'
      responses:
        '201':
          description: Customer registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: MSISDN is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /customers/lookup:
    get:
      summary: Look up a customer by MSISDN
      parameters:
        - in: query
          name: msisdn
          required: true
          schema:
            type: string
            pattern: '^\d{10}$'
      responses:
        '200':
          description: Customer lookup result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CustomerLookupData'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /customers/{msisdn}/profile:
    get:
      summary: Get a customer profile
      parameters:
        - $ref: '#/components/parameters/CustomerMsisdn'
      responses:
        '200':
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{msisdn}/plan:
    get:
      summary: Get a customer's active plan
      parameters:
        - $ref: '#/components/parameters/CustomerMsisdn'
      responses:
        '200':
          description: Active plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{msisdn}/usage:
    get:
      summary: Get a customer's latest usage record
      parameters:
        - $ref: '#/components/parameters/CustomerMsisdn'
      responses:
        '200':
          description: Usage record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{msisdn}/billing/latest:
    get:
      summary: Get a customer's latest bill
      parameters:
        - $ref: '#/components/parameters/CustomerMsisdn'
      responses:
        '200':
          description: Latest bill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{msisdn}/bills:
    get:
      summary: List a customer's bills
      parameters:
        - $ref: '#/components/parameters/CustomerMsisdn'
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [DUE, OVERDUE, PAID]
      responses:
        '200':
          description: Customer bills
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
  /customers/{msisdn}/bills/by-issue-date:
    get:
      summary: List a customer's bills issued on a specific date
      parameters:
        - $ref: '#/components/parameters/CustomerMsisdn'
        - in: query
          name: issueDate
          required: true
          description: Calendar date in UTC.
          schema:
            type: string
            format: date
            example: '2026-11-01'
      responses:
        '200':
          description: Customer bills issued on the requested date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '400':
          description: Invalid issue date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /customers/{msisdn}/360:
    get:
      summary: Get a customer's 360-degree view
      parameters:
        - $ref: '#/components/parameters/CustomerMsisdn'
      responses:
        '200':
          description: Combined customer, plan, usage, bill, case, and interaction data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{msisdn}/offers:
    get:
      summary: List offers available to a customer
      parameters:
        - $ref: '#/components/parameters/CustomerMsisdn'
      responses:
        '200':
          description: Eligible offers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{msisdn}/next-best-action:
    get:
      summary: Get a customer's recommended next action
      parameters:
        - $ref: '#/components/parameters/CustomerMsisdn'
      responses:
        '200':
          description: Recommended action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
  /customers/{msisdn}/plan-change:
    post:
      summary: Change a customer's plan
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
        - in: path
          name: msisdn
          required: true
          schema:
            type: string
            pattern: '^\d{10}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanChangeRequest'
      responses:
        '200':
          description: Plan change successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PlanChangeData'
        '409':
          description: Duplicate idempotency key or consent not granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /customers/{msisdn}/autopay:
    get:
      summary: Get autopay settings for a customer
      parameters:
        - $ref: '#/components/parameters/CustomerMsisdn'
      responses:
        '200':
          description: Autopay settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
    post:
      summary: Enable or disable autopay
      parameters:
        - $ref: '#/components/parameters/CustomerMsisdn'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutopayRequest'
      responses:
        '200':
          description: Updated autopay settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
  /customers/{msisdn}/sim:
    get:
      summary: Get a customer's SIM
      parameters:
        - $ref: '#/components/parameters/CustomerMsisdn'
      responses:
        '200':
          description: SIM details, or null if none is attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{msisdn}/sim-replacement/eligibility:
    get:
      summary: Check SIM replacement eligibility
      parameters:
        - $ref: '#/components/parameters/CustomerMsisdn'
      responses:
        '200':
          description: Eligibility decision and allowed reasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{msisdn}/interactions:
    get:
      summary: List a customer's interactions
      parameters:
        - $ref: '#/components/parameters/CustomerMsisdn'
      responses:
        '200':
          description: Customer interactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
  /identity/otp/send:
    post:
      summary: Send a one-time password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OtpSendData'
  /identity/otp/validate:
    post:
      summary: Validate a one-time password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpValidateRequest'
      responses:
        '200':
          description: OTP validated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OtpValidateData'
  /identity/verify:
    post:
      summary: Verify a customer by method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityVerifyRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IdentityVerifyData'
  /chatbot/fulfillment:
    post:
      summary: Fulfill a chatbot intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatbotFulfillmentRequest'
      responses:
        '200':
          description: Chatbot fulfillment response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
  /ivr/context:
    get:
      summary: Get IVR context for a phone number
      parameters:
        - in: query
          name: ani
          required: true
          schema:
            type: string
      responses:
        '200':
          description: IVR context payload
  /sim-replacement:
    post:
      summary: Create a SIM replacement request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimReplacementRequest'
      responses:
        '200':
          description: SIM replacement request created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SimReplacementData'
  /sim-replacement/{requestCode}:
    get:
      summary: Get a SIM replacement request
      parameters:
        - in: path
          name: requestCode
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SIM replacement details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans:
    get:
      summary: List active plans
      responses:
        '200':
          description: Active plans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
  /payments/link:
    post:
      summary: Create a payment link for a bill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentLinkRequest'
      responses:
        '200':
          description: Payment link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
  /payments/{billNumber}/status:
    get:
      summary: Check whether a bill payment was successful
      description: Read-only. A payment is successful when the bill status is PAID.
      parameters:
        - in: path
          name: billNumber
          required: true
          schema:
            type: string
            pattern: '^B-(?:[A-Fa-f0-9]{10}|\d{4}-\d{2})$'
      responses:
        '200':
          description: Payment status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaymentStatusData'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Invalid bill ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /segments:
    post:
      summary: Create a campaign segment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentCreateRequest'
      responses:
        '201':
          description: Segment created
  /segments/{id}/members:
    get:
      summary: List members of a segment
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Segment members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /campaigns:
    post:
      summary: Create an outbound campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
      responses:
        '201':
          description: Campaign created
  /campaigns/{id}/launch:
    post:
      summary: Launch a campaign
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Campaign launched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /campaigns/{id}/messages:
    get:
      summary: List messages for a campaign
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Campaign messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /messages/send:
    post:
      summary: Send a one-off message to a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Sent message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
  /webhooks/delivery:
    post:
      summary: Record a campaign message delivery update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryWebhookRequest'
      responses:
        '200':
          description: Delivery update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
  /webhooks/response:
    post:
      summary: Record a customer response to a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseWebhookRequest'
      responses:
        '200':
          description: Response update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
  /cases:
    post:
      summary: Create a service case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreateRequest'
      responses:
        '201':
          description: Case created
    get:
      summary: List cases
      parameters:
        - in: query
          name: msisdn
          required: false
          schema:
            type: string
            pattern: '^\d{10}$'
        - in: query
          name: status
          required: false
          schema:
            type: string
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        '200':
          description: Paginated cases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
  /cases/{caseNumber}:
    get:
      summary: Get a case by case number
      parameters:
        - $ref: '#/components/parameters/CaseNumber'
      responses:
        '200':
          description: Case details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a case by case number
      parameters:
        - $ref: '#/components/parameters/CaseNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseUpdateRequest'
      responses:
        '200':
          description: Updated case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /cases/{caseNumber}/notes:
    post:
      summary: Add a note to a case by case number
      parameters:
        - $ref: '#/components/parameters/CaseNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseNoteRequest'
      responses:
        '200':
          description: Updated case with note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /cases/{caseNumber}/sla:
    get:
      summary: Get case SLA status by case number
      parameters:
        - $ref: '#/components/parameters/CaseNumber'
      responses:
        '200':
          description: SLA deadline and breach status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /interactions:
    post:
      summary: Create a customer interaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionCreateRequest'
      responses:
        '201':
          description: Created interaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
  /conversations/escalate:
    post:
      summary: Escalate a conversation to a support queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationEscalationRequest'
      responses:
        '200':
          description: Conversation handoff details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
  /health:
    get:
      summary: Get API health status
      responses:
        '200':
          description: API health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
components:
  parameters:
    CustomerMsisdn:
      in: path
      name: msisdn
      required: true
      schema:
        type: string
        pattern: '^\d{10}$'
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: string
    CaseNumber:
      in: path
      name: caseNumber
      required: true
      schema:
        type: string
        pattern: '^CASE-\d{6}$'
        example: CASE-000045
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SuccessResponse:
      type: object
      required: [success, data, requestId]
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Response payload
        requestId:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      required: [success, error, requestId]
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ApiError'
        requestId:
          type: string
          format: uuid
    ApiError:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    TokenRequest:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id:
          type: string
          example: sprinklr-demo-client
        client_secret:
          type: string
          format: password
    TokenData:
      type: object
      required: [token]
      properties:
        token:
          type: string
    CustomerRegistrationRequest:
      type: object
      required: [msisdn, firstName, lastName]
      properties:
        msisdn:
          type: string
          pattern: '^\d{10}$'
          example: '3331239832'
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        tier:
          type: string
          enum: [STANDARD, PREMIUM]
          default: STANDARD
        language:
          type: string
          default: it
    CustomerLookupData:
      type: object
      required: [id, name, tier, msisdn, currentPlan]
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
          enum: [STANDARD, PREMIUM]
        msisdn:
          type: string
          description: Masked phone number
        currentPlan:
          allOf:
            - $ref: '#/components/schemas/PlanDetails'
          nullable: true
          description: Active plan, or null when the customer has no active subscription.
    PlanDetails:
      type: object
      required: [code, name, monthlyPrice, currency, dataGb, euRoaming, priority5g]
      properties:
        code:
          type: string
          example: 5G_START
        name:
          type: string
          example: 5G Start
        monthlyPrice:
          type: number
          format: float
          example: 14.99
        currency:
          type: string
          example: EUR
        dataGb:
          type: number
          example: 25
        euRoaming:
          type: boolean
        priority5g:
          type: boolean
    PlanChangeRequest:
      type: object
      required: [targetPlanCode, consent, channel]
      properties:
        targetPlanCode:
          type: string
        consent:
          type: boolean
        channel:
          type: string
          enum: [IVR, CHAT, AGENT, WHATSAPP, SMS]
    PlanChangeData:
      type: object
      required: [planChangeId, toPlan]
      properties:
        planChangeId:
          type: string
        toPlan:
          type: string
    OtpSendRequest:
      type: object
      required: [msisdn]
      properties:
        msisdn:
          type: string
          pattern: '^\d{10}$'
        channel:
          type: string
          enum: [SMS, EMAIL, VOICE]
          default: SMS
    OtpSendData:
      type: object
      required: [customerId, channel, expiresAt, otpCode]
      properties:
        customerId:
          type: string
        channel:
          type: string
        expiresAt:
          type: string
          format: date-time
        otpCode:
          type: string
          description: Demo OTP when MOCK_OTP is enabled; otherwise a sent status.
    OtpValidateRequest:
      type: object
      required: [msisdn, code]
      properties:
        msisdn:
          type: string
          pattern: '^\d{10}$'
        code:
          type: string
    OtpValidateData:
      type: object
      required: [valid, verified]
      properties:
        valid:
          type: boolean
        verified:
          type: boolean
    IdentityVerifyRequest:
      type: object
      required: [msisdn, method, value]
      properties:
        msisdn:
          type: string
          pattern: '^\d{10}$'
        method:
          type: string
          enum: [OTP, DOB, FISCAL_CODE]
        value:
          oneOf:
            - type: string
            - type: number
    IdentityVerifyData:
      type: object
      required: [result]
      properties:
        result:
          type: string
          enum: [PASS, FAIL]
    DeliveryAddress:
      type: object
      required: [street, city, postalCode, province]
      properties:
        street:
          type: string
        city:
          type: string
        postalCode:
          type: string
        province:
          type: string
    SimReplacementRequest:
      type: object
      required: [msisdn, reason, simType]
      properties:
        msisdn:
          type: string
          pattern: '^\d{10}$'
        reason:
          type: string
          enum: [LOST, DAMAGED, STOLEN, UPGRADE]
        simType:
          type: string
          enum: [PHYSICAL, ESIM]
        deliveryAddress:
          allOf:
            - $ref: '#/components/schemas/DeliveryAddress'
          description: Required when simType is PHYSICAL.
    SimReplacementData:
      type: object
      properties:
        requestCode:
          type: string
        status:
          type: string
        simType:
          type: string
          enum: [PHYSICAL, ESIM]
    SegmentCreateRequest:
      type: object
      required: [name, ruleType, rule]
      properties:
        name:
          type: string
        ruleType:
          type: string
          enum: [OVERDUE, UPGRADE_ELIGIBLE, CUSTOM]
        rule:
          type: object
          additionalProperties: true
    CampaignCreateRequest:
      type: object
      required: [name, channel, segmentId, template]
      properties:
        name:
          type: string
        channel:
          type: string
          enum: [SMS, VOICE, WHATSAPP]
        segmentId:
          type: string
        template:
          type: string
        scheduledAt:
          type: string
          format: date-time
    CaseCreateRequest:
      type: object
      required: [msisdn, channel, subject]
      properties:
        msisdn:
          type: string
          pattern: '^\d{10}$'
        channel:
          type: string
          enum: [VOICE, CHAT, EMAIL, SOCIAL, SMS, WHATSAPP]
        subject:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
    GenericSuccessResponse:
      type: object
      required: [success, data, requestId]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true
        requestId:
          type: string
          format: uuid
    AutopayRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    ChatbotFulfillmentRequest:
      type: object
      required: [intent, msisdn]
      properties:
        intent:
          type: string
          enum: [CHECK_BILL, CHECK_USAGE, UPGRADE_PLAN, CONFIRM_UPGRADE, SPEAK_TO_AGENT]
        msisdn:
          type: string
          pattern: '^\d{10}$'
        params:
          type: object
          additionalProperties: true
    PaymentLinkRequest:
      type: object
      required: [billId]
      properties:
        billId:
          type: string
    PaymentStatusData:
      type: object
      required: [billNumber, status, paymentSuccessful]
      properties:
        billNumber:
          type: string
        status:
          type: string
          enum: [PAID, DUE, OVERDUE]
        paymentSuccessful:
          type: boolean
    SendMessageRequest:
      type: object
      required: [msisdn, channel, template]
      properties:
        msisdn:
          type: string
          pattern: '^\d{10}$'
        channel:
          type: string
          enum: [SMS, VOICE, WHATSAPP]
        template:
          type: string
    DeliveryWebhookRequest:
      type: object
      required: [campaignId, msisdn, status]
      properties:
        campaignId:
          type: string
        msisdn:
          type: string
          pattern: '^\d{10}$'
        status:
          type: string
    ResponseWebhookRequest:
      type: object
      required: [campaignId, msisdn, responseText]
      properties:
        campaignId:
          type: string
        msisdn:
          type: string
          pattern: '^\d{10}$'
        responseText:
          type: string
    CaseUpdateRequest:
      type: object
      properties:
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
        assignedAgentId:
          type: string
    CaseNoteRequest:
      type: object
      required: [text, author]
      properties:
        text:
          type: string
        author:
          type: string
    InteractionCreateRequest:
      type: object
      required: [msisdn, channel, direction]
      properties:
        msisdn:
          type: string
          pattern: '^\d{10}$'
        caseNumber:
          type: string
          pattern: '^CASE-\d{6}$'
          description: Optional case number to associate with this interaction.
        channel:
          type: string
          enum: [VOICE, CHAT, EMAIL, SOCIAL, SMS, WHATSAPP]
        direction:
          type: string
          enum: [INBOUND, OUTBOUND]
        summary:
          type: string
        transcriptRef:
          type: string
    ConversationEscalationRequest:
      type: object
      required: [msisdn, intent, summary, context]
      properties:
        msisdn:
          type: string
          pattern: '^\d{10}$'
        intent:
          type: string
        summary:
          type: string
        context:
          type: object
          additionalProperties: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
